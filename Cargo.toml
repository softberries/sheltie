[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED" # placeholder until the license is decided (see docs/design.md)
repository = "https://github.com/softberries/sheltie"
homepage = "https://sheltie.dev"
authors = ["Softberries <hello@softberries.dev>"]
publish = false

[workspace.dependencies]
# Internal crates
sheltie-core = { path = "crates/sheltie-core" }
sheltie-graph = { path = "crates/sheltie-graph" }
sheltie-cargo = { path = "crates/sheltie-cargo" }
sheltie-github = { path = "crates/sheltie-github" }
sheltie-scheduler = { path = "crates/sheltie-scheduler" }
sheltie-merge = { path = "crates/sheltie-merge" }
sheltie-commit = { path = "crates/sheltie-commit" }
sheltie-sweeper = { path = "crates/sheltie-sweeper" }
sheltie-store = { path = "crates/sheltie-store" }
sheltie-api = { path = "crates/sheltie-api" }

# External crates. Add new ones here first, then use `{ workspace = true }` in a crate.
# Planned for later milestones (add when first used): petgraph, insta.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
# No TLS feature yet: local and in-cluster Postgres only. Add `tls-rustls-ring-webpki` when needed.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
dotenvy = "0.15"
octocrab = "0.54"
secrecy = "0.10"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

# Test-only
proptest = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
wiremock = "0.6"
aws-lc-rs = "1"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
