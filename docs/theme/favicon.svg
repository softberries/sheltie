<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sheltie">
  <title>Sheltie</title>
  <defs>
    <linearGradient id="sea" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#1f6fd1"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bd4a8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#2bd4a8"/>
      <stop offset="1" stop-color="#46c3f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b06f24"/>
      <stop offset=".45" stop-color="#cf8a34"/>
      <stop offset="1" stop-color="#dc9a45"/>
    </linearGradient>
    <clipPath id="badge"><circle cx="32" cy="32" r="31"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#sea)"/>
  <g clip-path="url(#badge)">
    <!-- the mirrie dancers -->
    <path d="M6 23 C17 9 41 5 58 15" fill="none" stroke="url(#aurora)" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
    <!-- neck and shoulder, behind the ruff -->
    <path d="M23 21 C16 25 11 34 9 46 L9 66 L22 66 C17 56 17 40 22 31 Z" fill="#9a5b1e"/>
    <!-- white ruff -->
    <path d="M21 27 C15 34 14 45 18 53 C22 60 31 64 40 61 C43 60 45 57.5 44.6 54.6 C46.2 53 45.8 50.6 43.8 49.6 C44.5 47.3 43 45.2 40.9 44.8 C41.1 42.6 39.1 41 36.9 41.3 C35.7 39.9 33.7 39.6 32 40.2 C28 40.4 24.8 38.6 22.6 35.6 C21 33 20.8 30 21 27 Z" fill="#f6f2ea"/>
  </g>
  <!-- ear, the tip folds forward -->
  <path d="M21.8 22.6 L23.8 10.4 C24.4 9.3 25.8 9.1 26.7 9.9 L32.2 13.6 L29.4 14.7 L32.4 18.2 Z" fill="#b5762a"/>
  <path d="M23.8 10.4 C24.4 9.3 25.8 9.1 26.7 9.9 L32.2 13.6 L29.4 14.7 L25.9 12.5 Z" fill="#6e3c12"/>
  <!-- head, facing right -->
  <path d="M22 26 C22 20 27 16 33 16.5 C37 17 39 19 41 21.5 C45 24 49 26.5 52.5 28.5 C54.5 29.6 54.6 32.4 52.2 33.4 C48 35 44 36.5 40 38 C35 40 28 40 24 37 C21.5 34.5 21.5 30 22 26 Z" fill="url(#coat)"/>
  <!-- white blaze along the muzzle, and the chin -->
  <path d="M37 17.6 C39.5 18.8 41.2 20.4 42.6 22.4 C46.4 24.7 49.6 26.6 52 28.3 C48.6 27.6 44.8 25.9 41.9 23.9 C40.5 21.6 38.9 19.5 37 17.6 Z" fill="#f6f2ea"/>
  <path d="M40 38 C44 36.6 48 35.2 52 33.6 C50 36.2 45.5 38.6 41.3 39.8 Z" fill="#f6f2ea"/>
  <!-- eye, nose, mouth -->
  <path d="M37.9 25.4 Q40.6 23.4 43.2 25.1 Q40.6 26.9 37.9 25.4 Z" fill="#0b2440"/>
  <circle cx="41.2" cy="24.9" r=".55" fill="#ffffff"/>
  <ellipse cx="53.2" cy="31" rx="1.75" ry="1.55" fill="#0b2440"/>
  <path d="M51.6 33.6 C49 34.8 46.5 35.5 44.4 35.8" fill="none" stroke="#7a4314" stroke-width=".7" stroke-linecap="round"/>
</svg>
