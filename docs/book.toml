[book]
title = "Sheltie"
description = "A parallel merge engine for agent-generated pull requests"
authors = ["Sheltie contributors"]
language = "en"
src = "."

[build]
build-dir = "../target/book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/sheltie.css"]
site-url = "/docs/"
git-repository-url = "https://github.com/softberries/sheltie"
edit-url-template = "https://github.com/softberries/sheltie/edit/main/docs/{path}"
