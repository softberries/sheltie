[package]
name = "sheltie-github"
description = "GitHub App: webhooks, check runs, labels, branches, merges."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
sheltie-core = { workspace = true }
sheltie-store = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
octocrab = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# test-support only
aws-lc-rs = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
sheltie-github = { path = ".", features = ["test-support"] }
sqlx = { workspace = true }
proptest = { workspace = true }
wiremock = { workspace = true }

[features]
# Helpers for tests in this and other crates: throwaway keys and signed OIDC tokens.
test-support = ["dep:aws-lc-rs", "dep:axum", "dep:base64"]

[lints]
workspace = true
