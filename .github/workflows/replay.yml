# Reusable workflow: Sheltie's intent replay (tier 4) on your runner, with Claude Code.
#
# Sheltie fires a `repository_dispatch` event of type `sheltie-replay` when a pull request that
# has a `sheltie-intent` block cannot be merged or breaks CI once merged, and `[replay]` is
# enabled in .sheltie/merge.toml on the default branch. Add this to the repository Sheltie
# manages (on the default branch, where repository_dispatch workflows run):
#
#   on:
#     repository_dispatch:
#       types: [sheltie-replay]
#   permissions:
#     contents: write        # the publish job pushes the result to sheltie/replay-result/*
#     id-token: write        # authenticates the report to Sheltie
#     pull-requests: read
#   jobs:
#     replay:
#       uses: softberries/sheltie/.github/workflows/replay.yml@main
#       with:
#         sheltie-url: https://sheltie.example.com
#         pr: ${{ github.event.client_payload.pr }}
#         head: ${{ github.event.client_payload.head }}
#         onto: ${{ github.event.client_payload.onto }}
#         mode: ${{ github.event.client_payload.mode }}
#       secrets:
#         anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Your API key stays in your repository's secrets; Sheltie never sees it. The agent and the
# acceptance tests run the pull request's code, so that job has a read-only token and no git
# credentials; a separate job, which runs no pull request code, publishes the result. Pull
# requests from forks are not replayed.
name: Sheltie intent replay

on:
  workflow_call:
    inputs:
      sheltie-url:
        required: true
        type: string
      pr:
        required: true
        type: number
      head:
        required: true
        type: string
      onto:
        required: true
        type: string
      mode:
        description: "`hunks` (4a) or `full` (4b)"
        required: true
        type: string
      audience:
        required: false
        type: string
        default: sheltie
      sheltie-ref:
        required: false
        type: string
        default: main
      sheltie-version:
        description: Release of Sheltie to download (e.g. v0.1.0); empty builds from sheltie-ref.
        required: false
        type: string
        default: ""
      claude-code-version:
        description: npm version of @anthropic-ai/claude-code
        required: false
        type: string
        default: latest
    secrets:
      anthropic-api-key:
        required: true
      sheltie-repo-token:
        description: Token that can read softberries/sheltie; only needed while it is private.
        required: false

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse pull requests from forks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          from=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" -q .head.repo.full_name)
          test "$from" = "$GITHUB_REPOSITORY" || { echo "PR #$PR comes from $from; not replayed"; exit 1; }

      - name: Check out the default branch at the commit to replay onto
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.onto }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head
        env:
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
          TOKEN: ${{ github.token }}
        run: |
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/sheltie/pr"
          test "$(git rev-parse refs/remotes/sheltie/pr)" = "$HEAD" || { echo "PR head moved"; exit 1; }

      - name: Check out sheltie-merge
        if: inputs.sheltie-version == ''
        uses: actions/checkout@v7
        with:
          repository: softberries/sheltie
          ref: ${{ inputs.sheltie-ref }}
          path: .sheltie-src
          token: ${{ secrets.sheltie-repo-token || github.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: inputs.sheltie-version == ''
        with:
          workspaces: .sheltie-src
          key: sheltie-merge

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install sheltie-merge and Claude Code
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
          SHELTIE_VERSION: ${{ inputs.sheltie-version }}
          GH_TOKEN: ${{ secrets.sheltie-repo-token || github.token }}
        run: |
          SHELTIE_VERSION="${SHELTIE_VERSION:-}"
          if [ -n "$SHELTIE_VERSION" ]; then
            [[ "$SHELTIE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad sheltie-version"; exit 1; }
            case "$(uname -m)" in
              x86_64) target=x86_64-unknown-linux-gnu ;;
              aarch64|arm64) target=aarch64-unknown-linux-gnu ;;
              *) echo "unsupported runner architecture"; exit 1 ;;
            esac
            name="sheltie-$SHELTIE_VERSION-$target"
            dl="$RUNNER_TEMP/sheltie-release"
            mkdir -p "$dl" "$RUNNER_TEMP/sheltie/bin"
            gh release download "$SHELTIE_VERSION" -R softberries/sheltie -D "$dl" --clobber -p "$name.tar.gz" -p SHA256SUMS
            (cd "$dl" && grep " $name.tar.gz\$" SHA256SUMS | sha256sum --check -)
            tar -xzf "$dl/$name.tar.gz" -C "$dl"
            install "$dl/$name/sheltie-merge" "$RUNNER_TEMP/sheltie/bin/"
          else
            cargo install --locked --path .sheltie-src/crates/sheltie-merge --root "$RUNNER_TEMP/sheltie"
          fi
          echo "$RUNNER_TEMP/sheltie/bin" >> "$GITHUB_PATH"
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          rm -rf .sheltie-src

      - name: Replay
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
          ONTO: ${{ inputs.onto }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in hunks) tier=4a ;; full) tier=4b ;; *) echo "bad mode"; exit 1 ;; esac
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" -q '.body // ""' > "$RUNNER_TEMP/body"
          title=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" -q .title)
          printf 'Merge #%s: %s\n\nSheltie-Replay: %s\nSheltie-Change: #%s\n' \
            "$PR" "$title" "$tier" "$PR" > "$RUNNER_TEMP/message"
          unset GH_TOKEN
          sheltie-merge replay --mode "$MODE" --pr "$PR" --onto "$ONTO" --head "$HEAD" \
            --pr-body-file "$RUNNER_TEMP/body" \
            --message-file "$RUNNER_TEMP/message" --out "$RUNNER_TEMP/report.json"
          jq '{tier, result, checks, cost_usd, turns, tokens, error}' "$RUNNER_TEMP/report.json"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/out/"
          result=$(jq -r '.result // empty' "$RUNNER_TEMP/report.json")
          if [ -n "$result" ]; then
            git branch -f sheltie-result "$result"
            git bundle create "$RUNNER_TEMP/out/result.bundle" sheltie-result "^$ONTO" "^$HEAD"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sheltie-replay
          path: ${{ runner.temp }}/out
          retention-days: 1

  publish:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the default branch at the commit replayed onto
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.onto }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: sheltie-replay
          path: ${{ runner.temp }}/out

      - name: Push the result
        env:
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
        run: |
          result=$(jq -r '.result // empty' "$RUNNER_TEMP/out/report.json")
          [ -n "$result" ] || exit 0
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/sheltie/pr"
          git fetch "$RUNNER_TEMP/out/result.bundle" "sheltie-result:refs/remotes/sheltie/result"
          test "$(git rev-parse refs/remotes/sheltie/result)" = "$result"
          # Sheltie's own branch: a retry onto a newer head replaces the earlier result.
          git push --force origin "${result}:refs/heads/sheltie/replay-result/${PR}-${HEAD:0:12}"

      - name: Report to Sheltie
        env:
          SHELTIE_URL: ${{ inputs.sheltie-url }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          curl -sSf --retry 3 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/out/report.json" "${SHELTIE_URL%/}/v1/replays"

  report-failure:
    # The replay or the publish job failed before reporting: tell Sheltie, so it escalates or
    # returns the change instead of waiting for a timeout.
    needs: [replay, publish]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Report the failure to Sheltie
        env:
          SHELTIE_URL: ${{ inputs.sheltie-url }}
          AUDIENCE: ${{ inputs.audience }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
          ONTO: ${{ inputs.onto }}
          MODE: ${{ inputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$MODE" in hunks) tier=replay_hunks ;; *) tier=replay_full ;; esac
          jq -n --argjson pr "$PR" --arg head "$HEAD" --arg onto "$ONTO" --arg tier "$tier" \
            --arg error "the replay workflow failed before it reported; see $RUN_URL" \
            '{pr: $pr, head: $head, onto: $onto, tier: $tier, result: null, checks: null,
              cost_usd: 0, turns: 0, error: $error}' > "$RUNNER_TEMP/report.json"
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          curl -sSf --retry 3 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/report.json" "${SHELTIE_URL%/}/v1/replays"
