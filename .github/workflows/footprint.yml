# Reusable workflow: computes a pull request's footprint with sheltie-cargo and uploads it
# to Sheltie, authenticated by a GitHub Actions OIDC token (no shared secret).
#
# Call it from the repository Sheltie manages:
#
#   on: pull_request
#   permissions:
#     contents: read
#     id-token: write        # lets the job request the OIDC token
#   jobs:
#     footprint:
#       uses: softberries/sheltie/.github/workflows/footprint.yml@main
#       with:
#         sheltie-url: https://sheltie.example.com
#
# The control plane never runs build tools; this job runs on your runner (see docs/design.md).
name: Sheltie footprint

on:
  workflow_call:
    inputs:
      sheltie-url:
        description: Base URL of the Sheltie server.
        required: true
        type: string
      audience:
        description: OIDC audience the server expects (SHELTIE_OIDC_AUDIENCE).
        required: false
        type: string
        default: sheltie
      sheltie-ref:
        description: Git ref of softberries/sheltie to build sheltie-cargo from.
        required: false
        type: string
        default: main
    secrets:
      sheltie-repo-token:
        description: Token that can read softberries/sheltie; only needed while it is private.
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  footprint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull request with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out sheltie-cargo
        uses: actions/checkout@v7
        with:
          repository: softberries/sheltie
          ref: ${{ inputs.sheltie-ref }}
          path: .sheltie-src
          token: ${{ secrets.sheltie-repo-token || github.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .sheltie-src
          key: sheltie-cargo

      - name: Build sheltie-cargo
        run: cargo install --locked --path .sheltie-src/crates/sheltie-cargo --root "$RUNNER_TEMP/sheltie"

      - name: Compute the footprint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/sheltie/bin/sheltie-cargo" footprint \
            --base "$BASE" --head "$HEAD" --out "$RUNNER_TEMP/footprint.json"
          jq '{writes: .footprint.writes | length, reads: .footprint.reads | length, leaky: .footprint.leaky}' "$RUNNER_TEMP/footprint.json"

      - name: Upload to Sheltie
        env:
          SHELTIE_URL: ${{ inputs.sheltie-url }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          curl -sSf --retry 3 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/footprint.json" \
            "${SHELTIE_URL%/}/v1/footprints"
