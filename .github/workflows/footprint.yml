# Reusable workflow: computes a pull request's footprint with sheltie-cargo and uploads it
# to Sheltie, authenticated by a GitHub Actions OIDC token (no shared secret). On pushes to the
# default branch it uploads the build graph instead, which Sheltie uses to predict the
# footprints of issues before anyone works on them.
#
# Call it from the repository Sheltie manages:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]     # your default branch
#   permissions:
#     contents: read
#     id-token: write        # lets the job request the OIDC token
#   jobs:
#     footprint:
#       uses: softberries/sheltie/.github/workflows/footprint.yml@main
#       with:
#         sheltie-url: https://sheltie.example.com
#
# The control plane never runs build tools; this job runs on your runner.
name: Sheltie footprint

on:
  workflow_call:
    inputs:
      sheltie-url:
        description: Base URL of the Sheltie server.
        required: true
        type: string
      audience:
        description: OIDC audience the server expects (SHELTIE_OIDC_AUDIENCE).
        required: false
        type: string
        default: sheltie
      sheltie-ref:
        description: Git ref of softberries/sheltie to build sheltie-cargo from.
        required: false
        type: string
        default: main
      plain:
        description: >-
          Globs, one per line, for data files outside the build (e.g. config/**, migrations/**):
          edits to the same file conflict, but they do not make footprints leaky.
        required: false
        type: string
        default: ""
      sheltie-version:
        description: Release of Sheltie to download (e.g. v0.1.0); empty builds from sheltie-ref.
        required: false
        type: string
        default: ""
    secrets:
      sheltie-repo-token:
        description: Token that can read softberries/sheltie; only needed while it is private.
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  footprint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull request with full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out sheltie-cargo
        if: inputs.sheltie-version == ''
        uses: actions/checkout@v7
        with:
          repository: softberries/sheltie
          ref: ${{ inputs.sheltie-ref }}
          path: .sheltie-src
          token: ${{ secrets.sheltie-repo-token || github.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: inputs.sheltie-version == ''
        with:
          workspaces: .sheltie-src
          key: sheltie-cargo

      - name: Install sheltie-cargo
        env:
          SHELTIE_VERSION: ${{ inputs.sheltie-version }}
          GH_TOKEN: ${{ secrets.sheltie-repo-token || github.token }}
        run: |
          SHELTIE_VERSION="${SHELTIE_VERSION:-}"
          if [ -n "$SHELTIE_VERSION" ]; then
            [[ "$SHELTIE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad sheltie-version"; exit 1; }
            case "$(uname -m)" in
              x86_64) target=x86_64-unknown-linux-gnu ;;
              aarch64|arm64) target=aarch64-unknown-linux-gnu ;;
              *) echo "unsupported runner architecture"; exit 1 ;;
            esac
            name="sheltie-$SHELTIE_VERSION-$target"
            dl="$RUNNER_TEMP/sheltie-release"
            mkdir -p "$dl" "$RUNNER_TEMP/sheltie/bin"
            gh release download "$SHELTIE_VERSION" -R softberries/sheltie -D "$dl" --clobber -p "$name.tar.gz" -p SHA256SUMS
            (cd "$dl" && grep " $name.tar.gz\$" SHA256SUMS | sha256sum --check -)
            tar -xzf "$dl/$name.tar.gz" -C "$dl"
            install "$dl/$name/sheltie-cargo" "$RUNNER_TEMP/sheltie/bin/"
          else
            cargo install --locked --path .sheltie-src/crates/sheltie-cargo --root "$RUNNER_TEMP/sheltie"
          fi

      - name: Compute the footprint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PLAIN: ${{ inputs.plain }}
        run: |
          args=()
          while IFS= read -r glob; do
            [ -n "$glob" ] && args+=(--plain "$glob")
          done <<< "$PLAIN"
          "$RUNNER_TEMP/sheltie/bin/sheltie-cargo" footprint "${args[@]}" \
            --base "$BASE" --head "$HEAD" --out "$RUNNER_TEMP/footprint.json"
          jq '{writes: .footprint.writes | length, reads: .footprint.reads | length, leaky: .footprint.leaky}' "$RUNNER_TEMP/footprint.json"

      - name: Upload to Sheltie
        env:
          SHELTIE_URL: ${{ inputs.sheltie-url }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          # GitHub issues no OIDC token to pull_request runs from forks, so a fork's footprint
          # cannot be uploaded; Sheltie then leaves the pull request to be merged by hand.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::notice title=Footprint not uploaded::No OIDC token for this run (pull requests from forks get none). Sheltie will not land this pull request; merge it by hand."
            exit 0
          fi
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          curl -sSf --retry 3 --retry-all-errors --max-time 30 \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/footprint.json" \
            "${SHELTIE_URL%/}/v1/footprints"

  graph:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out sheltie-cargo
        if: inputs.sheltie-version == ''
        uses: actions/checkout@v7
        with:
          repository: softberries/sheltie
          ref: ${{ inputs.sheltie-ref }}
          path: .sheltie-src
          token: ${{ secrets.sheltie-repo-token || github.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: inputs.sheltie-version == ''
        with:
          workspaces: .sheltie-src
          key: sheltie-cargo

      - name: Install sheltie-cargo
        env:
          SHELTIE_VERSION: ${{ inputs.sheltie-version }}
          GH_TOKEN: ${{ secrets.sheltie-repo-token || github.token }}
        run: |
          SHELTIE_VERSION="${SHELTIE_VERSION:-}"
          if [ -n "$SHELTIE_VERSION" ]; then
            [[ "$SHELTIE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad sheltie-version"; exit 1; }
            case "$(uname -m)" in
              x86_64) target=x86_64-unknown-linux-gnu ;;
              aarch64|arm64) target=aarch64-unknown-linux-gnu ;;
              *) echo "unsupported runner architecture"; exit 1 ;;
            esac
            name="sheltie-$SHELTIE_VERSION-$target"
            dl="$RUNNER_TEMP/sheltie-release"
            mkdir -p "$dl" "$RUNNER_TEMP/sheltie/bin"
            gh release download "$SHELTIE_VERSION" -R softberries/sheltie -D "$dl" --clobber -p "$name.tar.gz" -p SHA256SUMS
            (cd "$dl" && grep " $name.tar.gz\$" SHA256SUMS | sha256sum --check -)
            tar -xzf "$dl/$name.tar.gz" -C "$dl"
            install "$dl/$name/sheltie-cargo" "$RUNNER_TEMP/sheltie/bin/"
          else
            cargo install --locked --path .sheltie-src/crates/sheltie-cargo --root "$RUNNER_TEMP/sheltie"
          fi

      - name: Describe the build graph
        run: |
          rm -rf .sheltie-src
          "$RUNNER_TEMP/sheltie/bin/sheltie-cargo" graph --rev "$GITHUB_SHA" > "$RUNNER_TEMP/snapshot.json"
          jq -n --arg commit "$GITHUB_SHA" --slurpfile snapshot "$RUNNER_TEMP/snapshot.json" \
            '{commit: $commit, snapshot: $snapshot[0]}' > "$RUNNER_TEMP/graph.json"
          jq '{targets: .snapshot.targets | length, files: .snapshot.owners | length}' "$RUNNER_TEMP/graph.json"

      - name: Upload to Sheltie
        env:
          SHELTIE_URL: ${{ inputs.sheltie-url }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          curl -sSf --retry 3 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/graph.json" \
            "${SHELTIE_URL%/}/v1/graphs"
