# Release: binaries (sheltie-cargo, sheltie-merge, sheltie-server) for Linux x86_64/arm64 and
# macOS arm64 with SHA256SUMS, and a multi-arch image on GHCR. Runs on `v*` tags; run it by
# hand (workflow_dispatch) to build everything without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p sheltie-cargo -p sheltie-merge -p sheltie-server
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          name="sheltie-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp target/release/sheltie-cargo target/release/sheltie-merge target/release/sheltie-server \
            LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-24.04 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build (and push by digest on tags)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: ${{ github.ref_type == 'tag' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker,dest=/tmp/image.tar' }}
      - name: Smoke-test the image
        if: github.ref_type != 'tag'
        run: |
          id=$(docker load -i /tmp/image.tar | sed -n 's/^Loaded image ID: //p')
          test -n "$id"
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_USER=sheltie -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=sheltie postgres:17
          sleep 8
          docker run -d --name sheltie --network smoke -p 8080:8080 \
            -e DATABASE_URL=postgres://sheltie:pw@pg:5432/sheltie "$id"
          for _ in $(seq 1 30); do curl -sf localhost:8080/healthz && exit 0; sleep 2; done
          docker logs sheltie; exit 1
      - name: Record the digest
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*

  publish:
    if: github.ref_type == 'tag'
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Multi-arch image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sources=$(for d in /tmp/digests/*; do printf '%s@sha256:%s ' "$IMAGE" "$(basename "$d")"; done)
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" $sources
          docker buildx imagetools inspect "$IMAGE:$version"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
