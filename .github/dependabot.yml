version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must stay on the major version octocrab uses, or two copies are built.
      - dependency-name: jsonwebtoken
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The ref is the Rust toolchain (`@stable`, `@<MSRV>`), not an action version.
      - dependency-name: dtolnay/rust-toolchain
    commit-message:
      prefix: ci
