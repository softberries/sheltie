name: Milestone task
description: One implementation task from docs/backlog.md
labels: [task]
body:
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options: [M0, M1, M2, M3, M4, M4.5, M5, M6, M7, M8]
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What to build, with a pointer to the relevant section of docs/design.md.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The test or observable result that proves the task is complete.
    validations:
      required: true
