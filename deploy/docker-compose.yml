# Local development services. Start with: docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sheltie
      POSTGRES_PASSWORD: sheltie
      POSTGRES_DB: sheltie
    ports:
      - "5432:5432"
    volumes:
      - sheltie-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheltie"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sheltie-pg:
