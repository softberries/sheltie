[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ledger-core = { path = "crates/ledger-core" }
ledger-store = { path = "crates/ledger-store" }
ledger-auth = { path = "crates/ledger-auth" }
ledger-billing = { path = "crates/ledger-billing" }
