version = 1
revision = 2
requires-python = ">=3.11"

[manifest]
members = [
    "shop",
    "shop-api",
    "shop-app",
    "shop-core",
]

[[package]]
name = "shop"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "shop-app" },
]

[package.metadata]
requires-dist = [{ name = "shop-app", editable = "app" }]

[[package]]
name = "shop-api"
version = "0.1.0"
source = { editable = "packages/api" }
dependencies = [
    { name = "shop-core" },
]

[package.metadata]
requires-dist = [{ name = "shop-core", editable = "packages/core" }]

[[package]]
name = "shop-app"
version = "0.1.0"
source = { editable = "app" }
dependencies = [
    { name = "shop-api" },
]

[package.metadata]
requires-dist = [{ name = "shop-api", editable = "packages/api" }]

[[package]]
name = "shop-core"
version = "0.1.0"
source = { editable = "packages/core" }
