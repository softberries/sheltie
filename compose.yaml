# Self-hosted Sheltie: Postgres and the control plane. From the repository root:
#
#   scripts/register-github-app.py --url https://sheltie.example.com   # writes .env and the key
#   docker compose up -d --build
#
# Settings come from .env next to this file (see docs/self-hosting.md). Put a TLS-terminating
# reverse proxy in front of port 8080: GitHub must reach /webhooks/github and your CI /v1/*.
name: sheltie

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sheltie
      POSTGRES_PASSWORD: ${SHELTIE_POSTGRES_PASSWORD:?set SHELTIE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sheltie
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheltie"]
      interval: 5s
      timeout: 3s
      retries: 20

  sheltie:
    image: ${SHELTIE_IMAGE:-ghcr.io/softberries/sheltie:latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # The App key stays mode 600 on the host; the server runs as its owner to read it.
    user: "${SHELTIE_UID:-65532}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://sheltie:${SHELTIE_POSTGRES_PASSWORD}@postgres:5432/sheltie
      SHELTIE_BIND: 0.0.0.0:8080
      SHELTIE_GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app-key
    volumes:
      - ./${SHELTIE_GITHUB_KEY_FILE:-sheltie-github-app.pem}:/run/secrets/github-app-key:ro
    ports:
      # Localhost only: a TLS reverse proxy on the host forwards to it.
      - "127.0.0.1:${SHELTIE_PORT:-8080}:8080"

volumes:
  postgres:
